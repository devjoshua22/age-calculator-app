<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main wrapper to center content -->
    <main class="center-wrapper">
        <!-- Age Calculator Card -->
        <section class="calculator-card">
            <h1>Age Calculator</h1>
            <!-- Form for user input -->
            <form id="age-form">
                <div class="input-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" name="day" min="1" max="31" placeholder="DD" required>
                    <small class="error" id="day-error"></small>
                </div>
                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" name="month" min="1" max="12" placeholder="MM" required>
                    <small class="error" id="month-error"></small>
                </div>
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" min="1900" max="9999" placeholder="YYYY" required>
                    <small class="error" id="year-error"></small>
                </div>
                <!-- Submit button -->
                <button type="submit" id="calculate-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="46" height="44" viewBox="0 0 46 44"><g fill="none" stroke="#FFF" stroke-width="2"><path d="M1 22.019C8.333 21.686 23 25.616 23 44M23 44V0M45 22.019C37.667 21.686 23 25.616 23 44"/></g></svg>
                </button>
            </form>
            <!-- Result display -->
            <div class="result-group">
                <p><span id="result-years">--</span> years</p>
                <p><span id="result-months">--</span> months</p>
                <p><span id="result-days">--</span> days</p>
            </div>
        </section>
    </main>
    <script src="sandbox.js"></script>
</body>
</html>
